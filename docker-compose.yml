services:
  trove:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - trove-data:/data
    environment:
      - TROVE_DB_PATH=/data/trove.db
      - TROVE_STATIC_DIR=/app/static
      - TROVE_ENRICH_MODEL=${TROVE_ENRICH_MODEL:-claude-haiku-4-5}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TROVE_X_BEARER_TOKEN=${TROVE_X_BEARER_TOKEN:-}
      - TROVE_X_RSS_TEMPLATE=${TROVE_X_RSS_TEMPLATE:-}
      - TROVE_DISCOVER_MODEL=${TROVE_DISCOVER_MODEL:-claude-haiku-5-5}
      - TROVE_DISCOVER_EFFORT=${TROVE_DISCOVER_EFFORT:-low}
    restart: unless-stopped

volumes:
  trove-data:
